  &lt;article class=&quot;cb2-shell&quot; aria-label=&quot;Is Clean Beauty Still Relevant interactive outlook prototype&quot;&gt;
    &lt;header class=&quot;cb2-masthead&quot;&gt;
      &lt;div class=&quot;cb2-brand&quot;&gt;Clean Beauty Decision Lab&lt;/div&gt;
      &lt;div class=&quot;cb2-meta&quot;&gt;Jeannie Joshi · Version 4 · September 2026&lt;/div&gt;
    &lt;/header&gt;
    &lt;div class=&quot;cb2-concept-banner&quot;&gt;A concept prototype based on public clean-beauty research. Jev is not connected to this version.&lt;/div&gt;

    &lt;main class=&quot;cb2-main&quot;&gt;
      &lt;section aria-labelledby=&quot;cb2-title&quot;&gt;
        &lt;div class=&quot;cb2-eyebrow&quot;&gt;The article question&lt;/div&gt;
        &lt;h1 id=&quot;cb2-title&quot;&gt;Is Clean Beauty Still Relevant?&lt;/h1&gt;
        &lt;p class=&quot;cb2-deck&quot;&gt;Consumers still care about ingredients, safety, responsible production and results. The problem is that “clean beauty” now refers to all of those things at once.&lt;/p&gt;

        &lt;div class=&quot;cb2-thesis&quot;&gt;
          &lt;div&gt;
            &lt;div class=&quot;cb2-thesis-label&quot;&gt;Thesis&lt;/div&gt;
            &lt;div class=&quot;cb2-thesis-copy&quot;&gt;Clean beauty is still relevant, but it may no longer work as a single category.&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;cb2-definition&quot;&gt;The issue is not whether individual products or brands are credible. It is whether the category still has a clear and useful meaning.&lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;cb2-purpose&quot; aria-label=&quot;What this tool does&quot;&gt;
          &lt;div class=&quot;cb2-purpose-label&quot;&gt;What this tool does&lt;/div&gt;
          &lt;p class=&quot;cb2-purpose-copy&quot;&gt;Move the sliders to show what you think will happen to clean beauty over the next two years. The result changes as you move them.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;cb2-logic-map&quot; aria-labelledby=&quot;cb2-logic-title&quot;&gt;
        &lt;div class=&quot;cb2-section-label&quot;&gt;00 / How the tool works&lt;/div&gt;
        &lt;div class=&quot;cb2-logic-head&quot;&gt;
          &lt;h2 id=&quot;cb2-logic-title&quot;&gt;How the research connects to your result.&lt;/h2&gt;
          &lt;p&gt;The public evidence informed the questions below. Your slider choices change the result.&lt;/p&gt;
        &lt;/div&gt;
        &lt;ol class=&quot;cb2-logic-flow&quot; aria-label=&quot;Decision path from research question to category outlook&quot;&gt;
          &lt;li class=&quot;cb2-logic-node&quot;&gt;
            &lt;div class=&quot;cb2-logic-step&quot;&gt;Public research&lt;/div&gt;
            &lt;strong&gt;What is changing in the market?&lt;/strong&gt;
            &lt;p&gt;Clean skincare sales have weakened, retailers define clean differently and verification is becoming more important.&lt;/p&gt;
          &lt;/li&gt;
          &lt;li class=&quot;cb2-logic-node&quot;&gt;
            &lt;div class=&quot;cb2-logic-step&quot;&gt;Questions used here&lt;/div&gt;
            &lt;strong&gt;What would keep clean beauty relevant?&lt;/strong&gt;
            &lt;div class=&quot;cb2-logic-branches&quot; aria-label=&quot;Selected questions&quot;&gt;
              &lt;div class=&quot;cb2-logic-branch&quot;&gt;&lt;b&gt;40%&lt;/b&gt;&lt;span&gt;Retail visibility&lt;/span&gt;&lt;em&gt;Yes / No&lt;/em&gt;&lt;/div&gt;
              &lt;div class=&quot;cb2-logic-branch&quot;&gt;&lt;b&gt;35%&lt;/b&gt;&lt;span&gt;Commercial performance&lt;/span&gt;&lt;em&gt;Yes / No&lt;/em&gt;&lt;/div&gt;
              &lt;div class=&quot;cb2-logic-branch&quot;&gt;&lt;b&gt;25%&lt;/b&gt;&lt;span&gt;Standards and trust&lt;/span&gt;&lt;em&gt;Yes / No&lt;/em&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/li&gt;
          &lt;li class=&quot;cb2-logic-node&quot;&gt;
            &lt;div class=&quot;cb2-logic-step&quot;&gt;Your result&lt;/div&gt;
            &lt;strong&gt;Your choices are combined.&lt;/strong&gt;
            &lt;p&gt;Retail visibility counts for 40% of the result, brand performance for 35% and standards for 25%.&lt;/p&gt;
          &lt;/li&gt;
        &lt;/ol&gt;
        &lt;p class=&quot;cb2-framework-note&quot;&gt;&lt;strong&gt;Why the questions do not count equally:&lt;/strong&gt; retail has the largest share because the category depends on whether shoppers can still find it as a separate section. Brand performance comes next. Standards can strengthen trust even if retailers stop using “clean” as a category name.&lt;/p&gt;
        &lt;div class=&quot;cb2-logic-layers&quot; aria-label=&quot;Current and future versions of the decision tool&quot;&gt;
          &lt;div class=&quot;cb2-logic-layer&quot;&gt;
            &lt;span&gt;This prototype&lt;/span&gt;
            &lt;strong&gt;Your result&lt;/strong&gt;
            &lt;p&gt;Move the sliders and see the result change. Your choices are not saved.&lt;/p&gt;
          &lt;/div&gt;
          &lt;div class=&quot;cb2-logic-layer&quot;&gt;
            &lt;span&gt;A future version&lt;/span&gt;
            &lt;strong&gt;A separate result from Jev&lt;/strong&gt;
            &lt;p&gt;Jev, an AI model from TypeSafe, could review the same public evidence and return its own percentage for each question.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;cb2-section&quot; aria-labelledby=&quot;cb2-drivers-title&quot;&gt;
        &lt;div class=&quot;cb2-section-label&quot;&gt;01 / Your answers&lt;/div&gt;
        &lt;div class=&quot;cb2-section-head&quot;&gt;
          &lt;h2 id=&quot;cb2-drivers-title&quot;&gt;What do you think will happen?&lt;/h2&gt;
          &lt;p&gt;Move each slider toward No or Yes. Your result appears immediately after the questions. The starting positions are examples.&lt;/p&gt;
        &lt;/div&gt;

        &lt;div class=&quot;cb2-drivers&quot;&gt;
          &lt;div class=&quot;cb2-driver&quot; data-weight=&quot;0.40&quot;&gt;
            &lt;div class=&quot;cb2-driver-index&quot;&gt;01&lt;/div&gt;
            &lt;div&gt;
              &lt;div class=&quot;cb2-driver-question&quot;&gt;Over the next two years, will major U.S. beauty retailers continue to feature “clean” as a separate shopping category?&lt;/div&gt;
              &lt;div class=&quot;cb2-driver-direction&quot;&gt;&lt;strong&gt;This question counts for 40% of the overall result.&lt;/strong&gt; A Yes means clean remains a separate category at major national beauty retailers over the next two years.&lt;/div&gt;
              &lt;div class=&quot;cb2-research-signal&quot;&gt;
                &lt;div class=&quot;cb2-research-head&quot;&gt;&lt;span&gt;What the research shows&lt;/span&gt;&lt;strong&gt;Retailers still use clean, but define it differently&lt;/strong&gt;&lt;/div&gt;
                &lt;p&gt;Sephora still uses “Clean,” while Ulta separates clean ingredients, vegan, cruelty-free, packaging and social impact into different attributes.&lt;/p&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;cb2-driver-control&quot;&gt;
              &lt;div class=&quot;cb2-control-head&quot;&gt;&lt;label for=&quot;cb2-retail&quot;&gt;Chance of Yes&lt;/label&gt;&lt;output for=&quot;cb2-retail&quot;&gt;36%&lt;/output&gt;&lt;/div&gt;
              &lt;input class=&quot;cb2-range cursor-interaction&quot; id=&quot;cb2-retail&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;99&quot; value=&quot;36&quot; aria-label=&quot;Chance that retailers retain clean as a separate shopping category&quot; /&gt;
              &lt;div class=&quot;cb2-range-ends&quot;&gt;&lt;span&gt;No&lt;/span&gt;&lt;span&gt;Yes&lt;/span&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;details&gt;
              &lt;summary&gt;View evidence and sources&lt;/summary&gt;
              &lt;ul class=&quot;cb2-evidence&quot;&gt;
                &lt;li&gt;&lt;strong&gt;Retailers define the category differently&lt;/strong&gt;Ulta identifies clean ingredients, cruelty-free, vegan, sustainable packaging and giving back as separate Conscious Beauty attributes. &lt;a href=&quot;https://www.ulta.com/discover/conscious-beauty&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Ulta&lt;/a&gt;&lt;/li&gt;
                &lt;li&gt;&lt;strong&gt;Sephora still uses Clean&lt;/strong&gt;Sephora continues to merchandise Clean at Sephora alongside a separate Planet Aware program. &lt;a href=&quot;https://www.sephora.com/beauty/planet-aware&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Sephora&lt;/a&gt;&lt;/li&gt;
                &lt;li&gt;&lt;strong&gt;The category is still visible&lt;/strong&gt;Its meaning now varies by retailer and is often explained through separate product attributes.&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/details&gt;
          &lt;/div&gt;

          &lt;div class=&quot;cb2-driver&quot; data-weight=&quot;0.35&quot;&gt;
            &lt;div class=&quot;cb2-driver-index&quot;&gt;02&lt;/div&gt;
            &lt;div&gt;
              &lt;div class=&quot;cb2-driver-question&quot;&gt;Over the next two years, will clean-led skincare brands keep pace with clinical and biotech brands?&lt;/div&gt;
              &lt;div class=&quot;cb2-driver-direction&quot;&gt;&lt;strong&gt;This question counts for 35% of the overall result.&lt;/strong&gt; A Yes means clean-led skincare keeps pace with the wider prestige skincare market over the next two years.&lt;/div&gt;
              &lt;div class=&quot;cb2-research-signal&quot;&gt;
                &lt;div class=&quot;cb2-research-head&quot;&gt;&lt;span&gt;What the research shows&lt;/span&gt;&lt;strong&gt;Clean skincare is losing ground&lt;/strong&gt;&lt;/div&gt;
                &lt;p&gt;Circana reports declining clean skincare sales and a shift toward clinical expertise, while overall prestige skincare grew 3% in 2025. Clean fragrance remains a counterexample.&lt;/p&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;cb2-driver-control&quot;&gt;
              &lt;div class=&quot;cb2-control-head&quot;&gt;&lt;label for=&quot;cb2-market&quot;&gt;Chance of Yes&lt;/label&gt;&lt;output for=&quot;cb2-market&quot;&gt;28%&lt;/output&gt;&lt;/div&gt;
              &lt;input class=&quot;cb2-range cursor-interaction&quot; id=&quot;cb2-market&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;99&quot; value=&quot;28&quot; aria-label=&quot;Chance that clean-led skincare matches or exceeds clinical and biotech-led growth&quot; /&gt;
              &lt;div class=&quot;cb2-range-ends&quot;&gt;&lt;span&gt;No&lt;/span&gt;&lt;span&gt;Yes&lt;/span&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;details&gt;
              &lt;summary&gt;View evidence and sources&lt;/summary&gt;
              &lt;ul class=&quot;cb2-evidence&quot;&gt;
                &lt;li&gt;&lt;strong&gt;Clean skincare sales are down&lt;/strong&gt;Circana reports that clean skincare declined in early 2025 and had been declining in prestige channels since 2022 as consumers moved toward clinical expertise. &lt;a href=&quot;https://www.circana.com/post/what-it-means-to-be-clean&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Circana&lt;/a&gt;&lt;/li&gt;
                &lt;li&gt;&lt;strong&gt;Prestige skincare grew overall&lt;/strong&gt;U.S. prestige skincare finished 2025 up 3%, so clean skincare weakness cannot be explained only by a contracting skincare market. &lt;a href=&quot;https://www.circana.com/post/us-prestige-and-mass-beauty-retail-deliver-a-positive-performance-in-2025-circana-reports&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Circana&lt;/a&gt;&lt;/li&gt;
                &lt;li&gt;&lt;strong&gt;Clean fragrance is an exception&lt;/strong&gt;Circana also reports double-digit dollar growth for clean fragrance, showing that the pattern differs by product category.&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/details&gt;
          &lt;/div&gt;

          &lt;div class=&quot;cb2-driver&quot; data-weight=&quot;0.25&quot;&gt;
            &lt;div class=&quot;cb2-driver-index&quot;&gt;03&lt;/div&gt;
            &lt;div&gt;
              &lt;div class=&quot;cb2-driver-question&quot;&gt;Over the next two years, will independent standards make clean beauty claims easier for consumers to trust?&lt;/div&gt;
              &lt;div class=&quot;cb2-driver-direction&quot;&gt;&lt;strong&gt;This question counts for 25% of the overall result.&lt;/strong&gt; A Yes means independent certification and retailer standards become clearer and more widely used.&lt;/div&gt;
              &lt;div class=&quot;cb2-research-signal&quot;&gt;
                &lt;div class=&quot;cb2-research-head&quot;&gt;&lt;span&gt;What the research shows&lt;/span&gt;&lt;strong&gt;Verification is improving, but “clean” is still undefined&lt;/strong&gt;&lt;/div&gt;
                &lt;p&gt;Consumers report limited trust in voluntary labels. Certification, ingredient-safety data and regulatory documentation are expanding, but there is still no single accepted definition of “clean.”&lt;/p&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;cb2-driver-control&quot;&gt;
              &lt;div class=&quot;cb2-control-head&quot;&gt;&lt;label for=&quot;cb2-proof&quot;&gt;Chance of Yes&lt;/label&gt;&lt;output for=&quot;cb2-proof&quot;&gt;69%&lt;/output&gt;&lt;/div&gt;
              &lt;input class=&quot;cb2-range cursor-interaction&quot; id=&quot;cb2-proof&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;99&quot; value=&quot;69&quot; aria-label=&quot;Chance that independent verification strengthens leading clean claims&quot; /&gt;
              &lt;div class=&quot;cb2-range-ends&quot;&gt;&lt;span&gt;No&lt;/span&gt;&lt;span&gt;Yes&lt;/span&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;details&gt;
              &lt;summary&gt;View evidence and sources&lt;/summary&gt;
              &lt;ul class=&quot;cb2-evidence&quot;&gt;
                &lt;li&gt;&lt;strong&gt;Consumers favor independent verification&lt;/strong&gt;In an NSF-commissioned 2024 survey, only 9% completely trusted voluntary labels and 45% said they would pay more for certified products with organic ingredients. Organic is not the same as clean. &lt;a href=&quot;https://www.nsf.org/news/consumers-consider-personal-care-organic-ingredients-important&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;NSF&lt;/a&gt;&lt;/li&gt;
                &lt;li&gt;&lt;strong&gt;More ingredients now have safety data&lt;/strong&gt;ChemFORWARD’s 2025 industry dataset found 71% of disclosed ingredients verified safer and 24% still uncharacterized. &lt;a href=&quot;https://www.chemforward.org/news/bpc-leaders-release-2025-report&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;ChemFORWARD&lt;/a&gt;&lt;/li&gt;
                &lt;li&gt;&lt;strong&gt;MoCRA adds reporting and safety requirements&lt;/strong&gt;MoCRA adds requirements around registration, product listing, adverse-event reporting and safety substantiation, but it does not create one legal definition of clean. &lt;a href=&quot;https://www.fda.gov/cosmetics/cosmetics-laws-regulations/modernization-cosmetics-regulation-act-2022-mocra&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;FDA&lt;/a&gt;&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/details&gt;
          &lt;/div&gt;
        &lt;/div&gt;

      &lt;/section&gt;

      &lt;section class=&quot;cb2-section&quot; aria-labelledby=&quot;cb2-forecast-title&quot;&gt;
        &lt;div class=&quot;cb2-section-label&quot;&gt;02 / Your live result&lt;/div&gt;
        &lt;div class=&quot;cb2-section-head&quot;&gt;
          &lt;h2 id=&quot;cb2-forecast-title&quot;&gt;Your answers combine into one result.&lt;/h2&gt;
          &lt;p&gt;This result changes each time you move a slider.&lt;/p&gt;
        &lt;/div&gt;

        &lt;div class=&quot;cb2-score-panel&quot; aria-live=&quot;polite&quot; aria-atomic=&quot;true&quot;&gt;
          &lt;div class=&quot;cb2-live-indicator&quot;&gt;Live result&lt;/div&gt;
          &lt;div class=&quot;cb2-score-label&quot;&gt;Chance that clean remains a separate category&lt;/div&gt;
          &lt;div class=&quot;cb2-score-row&quot;&gt;
            &lt;output class=&quot;cb2-score&quot; id=&quot;cb2-score&quot;&gt;41%&lt;/output&gt;
            &lt;div class=&quot;cb2-score-language&quot; id=&quot;cb2-score-language&quot;&gt;Clean still matters, but becomes more specific.&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;cb2-scale&quot; role=&quot;img&quot; aria-label=&quot;Chance that clean beauty remains a separate category&quot;&gt;
            &lt;div class=&quot;cb2-scale-line&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;cb2-scale-fill&quot; id=&quot;cb2-scale-fill&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;cb2-scale-threshold low&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;cb2-scale-threshold high&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;cb2-scale-marker&quot; id=&quot;cb2-scale-marker&quot;&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;cb2-scale-labels&quot;&gt;&lt;span&gt;No longer separate&lt;/span&gt;&lt;span&gt;Still relevant, but changing&lt;/span&gt;&lt;span&gt;Remains separate&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;cb2-method-note&quot;&gt;Retail visibility contributes 40% of the result, brand performance 35%, and standards 25%.&lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;cb2-answer-key&quot; aria-label=&quot;Possible results&quot;&gt;
          &lt;div class=&quot;cb2-answer no&quot; data-outcome=&quot;low&quot;&gt;
            &lt;span class=&quot;cb2-active-label&quot;&gt;Current result&lt;/span&gt;
            &lt;strong&gt;Clean is no longer used as a separate category&lt;/strong&gt;
            &lt;span&gt;0–34% · Retailers and brands rely on more precise claims instead of using “clean” as a category name.&lt;/span&gt;
          &lt;/div&gt;

        if (value &lt; 65) return &#x27;Clean still matters, but becomes more specific.&#x27;;

        driver.querySelector(&#x27;input[type=&quot;range&quot;]&#x27;).addEventListener(&#x27;input&#x27;, () =&gt; update(true));

          temporary.value = text;
          temporary.setAttribute(&#x27;readonly&#x27;, &#x27;&#x27;);
          temporary.style.position = &#x27;absolute&#x27;;
          temporary.style.left = &#x27;-9999px&#x27;;

          copied = document.execCommand(&#x27;copy&#x27;);
